name: CI/CD

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: |
          mkdir -p out
          javac -d out src/models/*.java src/filters/*.java src/sorters/*.java src/repositories/*.java src/managers/*.java

      - name: Create JAR
        run: jar cf rbac-system.jar -C out .

      - name: Deploy
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployment time: $(date)"
          echo "JAR size: $(du -h rbac-system.jar | cut -f1)"
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "PRODUCTION DEPLOYMENT"
            mkdir -p production
            cp rbac-system.jar production/
          else
            echo "DEVELOPMENT DEPLOYMENT"
            mkdir -p development
            cp rbac-system.jar development/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: rbac-system
          path: rbac-system.jar